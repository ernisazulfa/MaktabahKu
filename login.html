<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaktabahKu - Masuk ke Sistem</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Amiri (Arab) & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 1.5s ease-in-out;
        }
        .font-arab { font-family: 'Amiri', serif; }

        .glass-card-3d {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.85), rgba(6, 30, 22, 0.92));
            backdrop-filter: blur(14px);
            border: 1px solid rgba(217, 119, 6, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(251, 191, 36, 0.3);
        }

        .btn-3d {
            background: linear-gradient(180deg, #d97706, #b45309);
            box-shadow: 0 4px 0 #78350f, 0 8px 15px rgba(0,0,0,0.5);
            transition: all 0.15s ease;
        }
        .btn-3d:hover {
            background: linear-gradient(180deg, #f59e0b, #d97706);
            transform: translateY(-2px);
        }
        .btn-3d:active {
            background: linear-gradient(180deg, #78350f, #451a03) !important;
            transform: translateY(2px) !important;
            filter: brightness(0.7);
        }

        .input-custom {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(217, 119, 6, 0.3);
            transition: all 0.2s ease;
        }
        .input-custom:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body id="pageBody" class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Overlay Gelap -->
    <div class="fixed inset-0 bg-slate-950/65 z-0"></div>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 w-full max-w-md">
        <div class="glass-card-3d p-8 rounded-3xl relative">

            <!-- LOGO & JUDUL -->
            <div class="text-center mb-6">
                <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center shadow-lg border border-amber-200/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-950" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-amber-300 tracking-wide">MaktabahKu</h1>
                <p class="text-xs text-emerald-200 font-medium mt-1">Maktabah Digital & Asisten Ajar Ustaz/ah</p>
                <div class="text-sm font-arab text-amber-200/80 mt-2">تسجيل الدخول إلى النظام</div>
            </div>

            <!-- FORM LOGIN -->
            <form onsubmit="goToDashboard(event)" class="space-y-5">

                <!-- OPSI PERAN -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">Pilih Peran Pengguna:</label>
                    <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900/80 rounded-xl border border-slate-700/50">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="ustadzah" class="peer hidden" checked>
                            <div class="text-center py-2 px-3 rounded-lg text-xs font-bold text-slate-400 peer-checked:bg-amber-500 peer-checked:text-slate-950 peer-checked:shadow-md transition">
                                Pengajar / Ustadzah
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="pengurus" class="peer hidden">
                            <div class="text-center py-2 px-3 rounded-lg text-xs font-bold text-slate-400 peer-checked:bg-amber-500 peer-checked:text-slate-950 peer-checked:shadow-md transition">
                                Penjaga Perpustakaan
                            </div>
                        </label>
                    </div>
                </div>

                <!-- INPUT NAMA -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="username">Nama / ID Pengguna</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-amber-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" id="username" placeholder="Masukkan nama atau ID anda" required class="input-custom w-full pl-9 pr-4 py-2.5 rounded-xl text-xs text-slate-100 placeholder-slate-400">
                    </div>
                </div>

                <!-- INPUT PASSWORD -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="password">Kata Sandi</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-amber-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="password" placeholder="••••••••••••" required class="input-custom w-full pl-9 pr-10 py-2.5 rounded-xl text-xs text-slate-100 placeholder-slate-400">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-amber-400">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- TOMBOL SUBMIT -->
                <button type="submit" class="btn-3d w-full py-3 px-4 text-slate-950 font-extrabold rounded-xl text-xs uppercase tracking-wider flex items-center justify-center space-x-2">
                    <span>Masuk ke Sistem</span>
                    <span class="font-arab text-sm">→</span>
                </button>

            </form>

            <div class="mt-6 text-center text-[11px] text-slate-400 border-t border-slate-800/80 pt-4">
                Sistem Perpustakaan & Asisten Digital Pesantren
            </div>

        </div>
    </main>

    <!-- SCRIPT JS -->
    <script>
        const bgImages = [
            'https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1600&q=80',
            'https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&w=1600&q=80',
            'https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=1600&q=80',
            'https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&w=1600&q=80'
        ];

        let currentBgIndex = 0;
        const bodyElement = document.getElementById('pageBody');

        function changeBackground() {
            bodyElement.style.backgroundImage = `url('${bgImages[currentBgIndex]}')`;
            currentBgIndex = (currentBgIndex + 1) % bgImages.length;
        }

        setInterval(changeBackground, 5000);

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
        }

        // SIMPAN ROLE KE LOCALSTORAGE SUPAYA TIDAK HILANG
        function goToDashboard(event) {
            event.preventDefault();
            const selectedRole = document.querySelector('input[name="role"]:checked').value;
            localStorage.setItem('userRole', selectedRole);
            window.location.href = './index.html';
        }
    </script>
</body>
</html>
