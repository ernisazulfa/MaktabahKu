<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaktabahKu - Form Peminjaman Kitab</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- External CSS Terpusat -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="pageBody" class="text-slate-100 min-h-screen flex flex-col relative bg-slate-950">

    <div class="fixed inset-0 bg-slate-950/65 z-0"></div>

    <header class="glass-header sticky top-0 z-50 px-6 py-3 transition-all">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center shadow-lg border border-amber-200/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-950" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold text-amber-300">MaktabahKu</h1>
                    <p class="text-[10px] text-emerald-200 font-medium">Portal Penjaga Perpustakaan</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center space-x-6 text-sm font-semibold">
                <a href="#" onclick="goHome(event)" class="text-slate-200 hover:text-amber-300 transition">Beranda</a>
                <a href="tentang.html" class="text-slate-200 hover:text-amber-300 transition">Tentang</a>
                <a href="fitur-utama.html" class="text-slate-200 hover:text-amber-300 transition">Fitur Utama</a>
                <a href="direktori.html" class="text-slate-200 hover:text-amber-300 transition">Koleksi Kitab</a>
            </nav>

            <div class="flex items-center space-x-3">
                <a href="index.html" class="bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition">Kembali ke Dashboard</a>
            </div>
        </div>
    </header>

    <main class="flex-1 p-6 max-w-3xl mx-auto w-full relative z-10 space-y-6 my-8">
        <div class="glass-card-blend p-8 rounded-3xl relative overflow-hidden space-y-6">
            <div class="text-center space-y-2">
                <span class="bg-amber-500/20 text-amber-300 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30">Sirkulasi Fisik</span>
                <h2 class="text-2xl font-extrabold text-amber-200 font-arab">إعارة الكتب - Form Peminjaman Kitab Santri</h2>
            </div>

            <form onsubmit="handlePeminjaman(event)" class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nama Lengkap Santri</label>
                    <input type="text" placeholder="Masukkan nama santri" required class="input-custom w-full px-4 py-2.5 rounded-xl text-xs text-slate-100 placeholder-slate-400">
                </div>
                <button type="submit" class="btn-3d w-full py-3 px-4 text-slate-950 font-extrabold rounded-xl text-xs uppercase tracking-wider">Simpan Data Peminjaman ✓</button>
            </form>
        </div>
    </main>

    <script>
        function handlePeminjaman(event) {
            event.preventDefault();
            alert('Data peminjaman kitab santri berhasil dicatat ke dalam sistem perpustakaan!');
            window.location.href = 'index.html';
        }
        function goHome(event) {
            event.preventDefault();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
